{% extends "base.html" %}
{% block content %}

<div class="card shadow-sm mx-auto text-center" style="max-width: 500px;">
    <div class="card-body">
        <h4 class="mb-3">Delete Product</h4>
        <p>Are you sure you want to delete <strong>{{ object.name }}</strong>?</p>

        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Yes, Delete</button>
            <a href="{% url 'product_list' %}" class="btn btn-secondary">Cancel</a>
        </form>
    </div>
</div>

{% endblock %}
